<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آیت سیّد | کتابِ احساس</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: radial-gradient(circle at top, #261421 0%, #140e17 42%, #09090b 85%);
      color: #f5f5f5;
      min-height: 100vh;
      line-height: 1.9;
      overflow-x: hidden;
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 90px;
      text-align: center;
    }

    /* کتاب اور رومانٹک منظر کا سیکشن */
    .book-stage {
      min-height: 82vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.5s ease, opacity 0.5s ease;
    }

    .book-stage.condensed {
      min-height: auto;
      padding: 22px;
      background: #17121c;
      border: 1px solid rgba(255, 213, 79, 0.35);
      border-radius: 18px;
      transform: scale(0.96);
    }

    .romantic-art {
      width: 220px;
      height: 130px;
      margin-bottom: 14px;
      filter: drop-shadow(0 10px 25px rgba(255, 180, 120, 0.25));
      animation: gentleGlow 3.2s ease-in-out infinite;
    }

    @keyframes gentleGlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .books-stack {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      min-height: 170px;
    }

    .color-book {
      width: 112px;
      height: 154px;
      border-radius: 6px 16px 16px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 8px;
      font-weight: bold;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.55), inset -6px 0 12px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(-160px) rotate(-10deg);
      animation: dropAndGather 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .book-pages {
      width: 85%;
      height: 6px;
      background: repeating-linear-gradient(
        90deg,
        #fff8e7,
        #fff8e7 2px,
        #d6c7a9 2px,
        #d6c7a9 4px
      );
      border-radius: 2px;
    }

    .book-art {
      font-size: 1.8rem;
      line-height: 1;
    }

    .book-label {
      font-size: 0.95rem;
    }

    .book-gold {
      background: linear-gradient(135deg, #6e4b08 0%, #d4af37 55%, #ffe082 100%);
      color: #161104;
      border-right: 7px solid #fff3c4;
      animation-delay: 0.15s;
    }

    .book-ruby {
      background: linear-gradient(135deg, #631029 0%, #c21e56 55%, #ff7597 100%);
      color: #fff;
      border-right: 7px solid #ffd6e0;
      animation-delay: 0.55s;
    }

    .book-emerald {
      background: linear-gradient(135deg, #0b4636 0%, #158467 55%, #5eead4 100%);
      color: #fff;
      border-right: 7px solid #ccfbf1;
      animation-delay: 0.95s;
    }

    .book-royal {
      background: linear-gradient(135deg, #2e1463 0%, #6432d4 55%, #b197fc 100%);
      color: #fff;
      border-right: 7px solid #e5dbff;
      animation-delay: 1.35s;
    }

    @keyframes dropAndGather {
      0% {
        opacity: 0;
        transform: translateY(-160px) rotate(-10deg) scale(0.92);
      }
      70% {
        opacity: 1;
        transform: translateY(8px) rotate(2deg) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }

    .gold-title {
      font-size: 2.3rem;
      font-weight: bold;
      background: linear-gradient(90deg, #ffe082, #ffb300, #fff3c4, #ffc107);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .gold-sub {
      color: #f3d27a;
      font-size: 1.15rem;
      margin-bottom: 18px;
    }

    .scroll-hint {
      margin-top: 12px;
      color: #ffd54f;
      font-size: 1rem;
      letter-spacing: 0.5px;
      animation: pulseText 1.8s infinite;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.55; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(5px); }
    }

    /* 300 روپے ممبرشپ سیکشن */
    .membership-section {
      margin-top: 50px;
      background: #15121a;
      border: 1px solid rgba(255, 213, 79, 0.28);
      border-radius: 16px;
      padding: 32px 22px;
    }

    .btn-gold {
      background: linear-gradient(90deg, #ffca28, #ffb300);
      color: #111;
      border: none;
      padding: 13px 28px;
      font-size: 1.05rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-gold:hover {
      filter: brightness(1.08);
    }

    .btn-lock-test {
      background: #2b2436;
      color: #ffe082;
      border: 1px solid rgba(255, 213, 79, 0.35);
      padding: 10px 18px;
      font-size: 0.92rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
      margin-right: 8px;
    }

    .btn-wa {
      background: linear-gradient(90deg, #25d366, #128c7e);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
      margin-right: 8px;
    }

    .btn-wa:hover {
      filter: brightness(1.08);
    }

    .payment-panel {
      display: none;
      margin-top: 26px;
      text-align: right;
      background: #1d1924;
      border: 1px solid #ffc107;
      border-radius: 12px;
      padding: 22px;
    }

    .accounts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin: 16px 0;
    }

    .acc-box {
      background: #272230;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 213, 79, 0.25);
    }

    .acc-box h3 {
      color: #ffd54f;
      margin-bottom: 6px;
    }

    .confirm-box {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .status-msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 193, 7, 0.14);
      color: #ffe082;
      display: none;
    }

    /* 5 کتابیں */
    .topics-box {
      margin-top: 38px;
      background: #141118;
      border: 1px solid rgba(255, 213, 79, 0.2);
      border-radius: 18px;
      padding: 28px 20px;
    }

    .topics-box h2 {
      color: #ffd54f;
      margin-bottom: 8px;
    }

    .lock-notice {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(255, 193, 7, 0.12);
      border: 1px solid rgba(255, 213, 79, 0.35);
      color: #ffe082;
      font-size: 0.98rem;
      display: none;
    }

    .books-3d-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 20px;
      margin-top: 24px;
      perspective: 900px;
    }

    .card-3d-book {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .card-3d-book:hover {
      transform: translateY(-8px);
    }

    .cover-3d {
      width: 125px;
      height: 170px;
      border-radius: 5px 16px 16px 5px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: bold;
      box-shadow:
        -6px 10px 22px rgba(0, 0, 0, 0.65),
        inset -8px 0 14px rgba(0, 0, 0, 0.4),
        inset 2px 2px 6px rgba(255, 255, 255, 0.25);
      transform: rotateY(-12deg) rotateX(4deg);
      transition: transform 0.3s ease;
    }

    .card-3d-book:hover .cover-3d {
      transform: rotateY(0deg) rotateX(0deg);
    }

    .cover-3d .spine-line {
      width: 84%;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.55);
    }

    .cover-3d .book-title-3d {
      font-size: 1.15rem;
      text-align: center;
    }

    .book-lock-badge {
      font-size: 0.85rem;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.32);
    }

    .c-love {
      background: linear-gradient(135deg, #6b0f2b 0%, #c9184a 55%, #ff758f 100%);
      color: #fff;
      border-right: 7px solid #ffb3c1;
    }

    .c-romance {
      background: linear-gradient(135deg, #4a154b 0%, #8e24aa 55%, #ce93d8 100%);
      color: #fff;
      border-right: 7px solid #f3e5f5;
    }

    .c-touch {
      background: linear-gradient(135deg, #6e3b08 0%, #c67c14 55%, #ffd166 100%);
      color: #171206;
      border-right: 7px solid #fff3c4;
    }

    .c-novels {
      background: linear-gradient(135deg, #0b3d4c 0%, #167996 55%, #64dfdf 100%);
      color: #fff;
      border-right: 7px solid #caf0f8;
    }

    .c-woman {
      background: linear-gradient(135deg, #124535 0%, #238667 55%, #74c69d 100%);
      color: #fff;
      border-right: 7px solid #d8f3dc;
    }

    /* ٹچ کرنے سے پلٹنے والا صفحہ */
    .book-reader-overlay {
      display: none;
      margin-top: 30px;
      background: #191520;
      border: 1px solid #ffd54f;
      border-radius: 18px;
      padding: 22px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
    }

    .book-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 213, 79, 0.25);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .book-top-bar h3 {
      color: #ffd54f;
      font-size: 1.35rem;
    }

    .ctrl-btn {
      background: #2b2436;
      color: #ffe082;
      border: 1px solid rgba(255, 213, 79, 0.4);
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .ctrl-btn:hover {
      background: #ffc107;
      color: #111;
    }

    .book-page-sheet {
      cursor: pointer;
      user-select: none;
      background: linear-gradient(180deg, #fbf5e6 0%, #f3e6ca 100%);
      color: #24190e;
      border-radius: 12px 4px 4px 12px;
      border-right: 12px solid #8c5a19;
      box-shadow:
        -6px 10px 24px rgba(0, 0, 0, 0.45),
        inset 12px 0 22px rgba(139, 90, 25, 0.16);
      padding: 28px 24px 20px;
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: right;
      animation: pageTurnIn 0.45s ease;
    }

    @keyframes pageTurnIn {
      0% {
        opacity: 0.25;
        transform: perspective(900px) rotateY(18deg) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: perspective(900px) rotateY(0deg) translateY(0);
      }
    }

    .page-topic-header {
      border-bottom: 2px solid rgba(140, 90, 25, 0.3);
      padding-bottom: 10px;
      margin-bottom: 16px;
      text-align: center;
    }

    .page-topic-title {
      font-size: 1.4rem;
      color: #4a2c0a;
      font-weight: bold;
    }

    .page-caption-body {
      font-size: 1.1rem;
      line-height: 2.05;
      color: #2c1e11;
      white-space: pre-line;
      margin: auto 0;
      padding: 6px 4px;
    }

    .page-footer-num {
      margin-top: 18px;
      padding-top: 8px;
      border-top: 1px dashed rgba(140, 90, 25, 0.3);
      font-size: 1.05rem;
      color: #7a5220;
      font-weight: bold;
      text-align: center;
    }

    /* ہر کتاب کا فیڈبیک سیکشن */
    .book-feedback-box {
      margin-top: 22px;
      text-align: right;
      background: #131018;
      border: 1px solid rgba(255, 213, 79, 0.28);
      border-radius: 14px;
      padding: 18px;
    }

    .book-feedback-box h4 {
      color: #ffd54f;
      margin-bottom: 12px;
      font-size
